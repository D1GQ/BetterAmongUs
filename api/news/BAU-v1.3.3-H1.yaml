 # Better Among Us v1.3.3 Hotfix 1

 We are thrilled to announce this hotfix of **BetterAmongUs**, a mod designed to enhance your Among Us experience!
 ---

 ## Change Log

 #### Mod
 - **Among Us Compatibility**: Updated to Among Us 2026.8.18
 ---
  #### Changed
 - **Better Role Algorithm**: Removed Better Role Algorithm due to it being redundant after recent changes.
 ---
 #### Bug Fixes
 - Fixed issues that caused other players to be kicked by the server when hosting
 - Fixed player meeting info not properly being set up on disconnected players
 - Fixed float option decimal offset
